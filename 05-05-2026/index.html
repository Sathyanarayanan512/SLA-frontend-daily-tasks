<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <a class="navbar-brand">My Website</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav1">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="nav1" class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" href="#">
                        Services
                    </a>
                    <ul class="dropdown-menu">
                        <li><a href="#" class="dropdown-item">Service 1</a></li>
                        <li><a href="#" class="dropdown-item">Service 2</a></li>
                    </ul>
                </li>
            </ul>
            </div>
        </nav>
    </div>


    <button class="btn btn-primary m-3" data-bs-toggle="modal" data-bs-target="#mod1">Open dialog (btn-primary)</button>
    <button class="btn btn-outline-success m-3" data-bs-toggle="modal" data-bs-target="#mod1">Open dialog (btn-outline-success)</button>
    <div class="modal" id="mod1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1>Alert</h1>
                </div>
                <div class="modal-body">
                    <p>Are you sure to exit?<br>Don't you want to fill the form below?</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary">Yes</button>
                    <button class="btn btn-primary" data-bs-dismiss="modal">Dismiss</button>
                </div>
            </div>
        </div>
    </div>


    <div class="container">
    <div class="card shadow">
    <div class="d-flex flex-column justify-content-center align-items-center p-3">
        <h3>Contact Form</h3>
        <div class="mb-3">
        <label class="form-label">Name</label>
        <div class="input-group" style='width:325px;'>
        <input class="form-control" type="text">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <div class="input-group" style='width:325px;'>
        <input class="form-control" type="email">
        <span class="input-group-text">@gmail.com</span>
        </div>
    </div>
    <div class="mb-3" style="width:325px;">
        <label class="form-label">Message</label>
        <input class="form-control" type="text">
    </div>
    <div class="mb-3 d-flex justify-content-between">
        <button class="btn btn-primary me-2">Submit</button>
        <button class="btn btn-danger">Cancel</button>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="checkbox">
        <label class="form-check-label">Remember my details</label>
    </div>
    </div>
    </div>
    </div>
</body>
</html>
